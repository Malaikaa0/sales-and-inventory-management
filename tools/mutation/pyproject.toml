[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqe-mutation-operators"
version = "1.0"
description = "Cosmic Ray operators for this project's business rules"
dependencies = ["cosmic-ray==8.9.0"]

[project.entry-points."cosmic_ray.operator_providers"]
sqe = "sqe_operators:Provider"

[tool.setuptools]
py-modules = ["sqe_operators"]
