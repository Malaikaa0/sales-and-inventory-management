# SonarQube analysis of accounts, store and transactions. Results: docs/sonar-triage.md.
sonar.projectKey=sales-and-inventory-management
sonar.projectName=Sales and Inventory Management

sonar.sources=accounts,store,transactions
sonar.tests=tests/team
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Not analysed: generated migrations and upstream tests.
sonar.exclusions=**/migrations/**,**/tests.py

sonar.python.coverage.reportPaths=coverage.xml

# Left out of the coverage figure only; still analysed for issues.
# This list matches the [report] omit list in .coveragerc.
sonar.coverage.exclusions=\
  accounts/__init__.py,accounts/admin.py,accounts/apps.py,accounts/context_processors.py,\
  accounts/filters.py,accounts/forms.py,accounts/middleware.py,\
  accounts/signals.py,accounts/tables.py,accounts/urls.py,accounts/views.py,\
  store/management/**,store/templatetags/**,store/filters.py,\
  transactions/filters.py,transactions/tables.py,\
  **/*.html
